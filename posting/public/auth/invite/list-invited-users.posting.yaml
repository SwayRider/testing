name: List Invited Users
description: |-
  List the invited users

  Only lists the users that have not yet registered.
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/admin/list-invites
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json
params:
- name: page
  value: '1'
- name: pagesize
  value: '10'
- name: registered
  value: 'false'
  enabled: false

name: Invite User
description: Invites a user to the Swayrider Platform
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/admin/invite-user
body:
  content: |-
    {
      "email":"${INVITE_USER}"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json

name: Revoke Invite
description: |-
  Revokes an invitation

  Only an invitation that has not yet registered, can be revoked
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/admin/revoke-invite
body:
  content: |-
    {
      "email":"${INVITE_USER}"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json

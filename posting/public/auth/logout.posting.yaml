name: Logout
description: Performs a logout of the currently logged in user
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/logout
body:
  content: |-
    {
      "refresh_token":"${refresh_token}"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json

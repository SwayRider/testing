name: Register New User
description: |-
  Registers a new user in the system.

  When the api is running in invite_only mode, this will only work for invited users.
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/register
body:
  content: |-
    {
      "email":"${REGISTRATION_USER}",
      "password":"${REGISTRATION_PASSWORD}",
      "verification_url":"${API_SCHEMA}://${API_HOST}:${API_PORT}/web/verify-user"
    }
  content_type: application/json
headers:
- name: content-type
  value: application/json

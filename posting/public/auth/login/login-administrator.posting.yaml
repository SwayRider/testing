name: Login Administrator
description: Health check endpoint of the swayrider-api service
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/login
body:
  content: |-
    {
      "email":"${ADMIN_USER}",
      "password":"${ADMIN_PASSWORD}"
    }
  content_type: application/json
headers:
- name: content-type
  value: application/json
scripts:
  on_response: scripts/parse_tokens.py

name: Refresh Token
description: Refreshes the access token
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/refresh
body:
  content: |-
    {
      "refresh_token":"${refresh_token}"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json
scripts:
  on_response: scripts/parse_tokens.py

name: Change Password (2->1)
description: Changes the password from password 2 to password 1
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/change-password
body:
  content: |-
    {
      "old_password": "${REGISTRATION_PASSWORD_NEW}",
      "new_password": "${REGISTRATION_PASSWORD}"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json

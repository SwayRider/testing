name: Change Password (1->2)
description: Changes the password from password 1 to password 2
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/change-password
body:
  content: |-
    {
      "old_password": "${REGISTRATION_PASSWORD}",
      "new_password": "${REGISTRATION_PASSWORD_NEW}"
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: $access_token
headers:
- name: content-type
  value: application/json

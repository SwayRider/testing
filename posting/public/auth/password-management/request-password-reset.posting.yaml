name: Request Password Reset
description: Requests a password reset for your own password
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/request-password-reset
body:
  content: |-
    {
     "email": "${REGISTRATION_USER}"
    }
  content_type: application/json
headers:
- name: content-type
  value: application/json

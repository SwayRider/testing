name: Route (Single Region)
description: Calculates a route in a single region
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/route
body:
  content: |-
    {
      "from": {
        "lat": 51.228,
        "lon": 4.406
      },
      "to": {
        "lat": 51.729,
        "lon": 3.774
      },
      "vehicle": "motorcycle",
      "options": {
        "avoidTollRoads": false,
        "avoidHighways": false,
        "avoidFerries": false,
        "scenicPreference": 0.5
      }
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: ${access_token}
headers:
- name: content-type
  value: application/json

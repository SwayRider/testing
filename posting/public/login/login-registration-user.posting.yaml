name: Login Registration User
description: Log in the registration user
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/auth/login
body:
  content: |-
    {
      "email":"${REGISTRATION_USER}",
      "password":"${REGISTRATION_PASSWORD}"
    }
  content_type: application/json
headers:
- name: content-type
  value: application/json
scripts:
  on_response: scripts/parse_tokens.py

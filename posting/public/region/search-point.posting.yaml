name: Search Point
description: Returns the region that contains the point
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/region/search-point
body:
  content: |-
    {
      "location": {
        "lat": 49.909,
        "lon": 4.743
      },
      "include_extended": true
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: ${access_token}
headers:
- name: content-type
  value: application/json

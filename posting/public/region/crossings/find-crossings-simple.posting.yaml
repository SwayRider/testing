name: Find Crossings (Simple)
description: |-
  Find crossing locations.

  Simple version
method: POST
url: ${API_SCHEMA}://${API_HOST}:${API_PORT}/api/v1/region/find-crossing-locations
body:
  content: |-
    {
      "from_region": "benelux",
      "to_region": "france",
      "from_location": {
        "lat": 51.126,
        "lon": 5.1
      },
      "to_location": {
        "lat": 50.707,
        "lon": 1.612
      },
      "config": {
        "type": "simple",
        "road_type_order": ["TRUNK", "PRIMARY"]
      },
      "limit": 6
    }
  content_type: application/json
auth:
  type: bearer_token
  bearer_token:
    token: ${access_token}
headers:
- name: content-type
  value: application/json

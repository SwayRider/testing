name: Create Registration Verification Token
description: |-
  Creates a verification token for a newly registered user.

  This token should be used to send to the user's email address in order to verify the users's email address.
url: ${AUTH_SCHEMA}://${AUTH_HOST}:${AUTH_PORT}/api/v1/auth/create-verification-token
body:
  content: |-
    {
      "email":"${REGISTRATION_USER}",
      "password":"${REGISTRATION_PASSWORD}",
      "verification_url":"${API_SCHEMA}://${API_HOST}:${API_PORT}/web"
    }
  content_type: application/json
headers:
- name: content-type
  value: application/json
scripts:
  on_response: scripts/get_verification_token.py

services:
  redis:
    image: redis:7-alpine
    container_name: sw-test-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "36379:6379"
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 384m
